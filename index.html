<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">Student Manager</div>
    <div class="nav">
      <a href="#">Главная</a>
      <a href="#">Студенты</a>
      <a href="#">О нас</a>
    </div>
  </header>

  <main class="container">

    <section class="intro">
      <h1>Управление студентами</h1>
      <p>Добавляйте студентов и просматривайте список группы</p>
    </section>

    <section class="form-block">
      <h2>Добавить студента</h2>
      <form action="#" method="get">

        <div class="field">
          <label for="first-name">Имя</label>
          <input type="text" id="first-name" name="first-name" placeholder="Введите имя">
        </div>

        <div class="field">
          <label for="last-name">Фамилия</label>
          <input type="text" id="last-name" name="last-name" placeholder="Введите фамилию">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="group">Группа</label>
          <input type="text" id="group" name="group" placeholder="Например, ИС-21">
        </div>

        <button type="submit">Добавить студента</button>
      </form>
    </section>

  </main>

</body>
</html>
